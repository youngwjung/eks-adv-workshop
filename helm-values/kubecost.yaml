global:
  prometheus:
    enabled: false
    fqdn: ${thanos_query_fqdn}
  grafana:
    enabled: false
    domainName: ${grafana_domain_name}
    scheme: https
grafana:
  sidecar:
    dashboards:
      enabled: false
serviceMonitor:
  enabled: true
ingress:
  enabled: true
  className: nginx
  hosts:
  - ${hostname}
kubecostFrontend:
  image: public.ecr.aws/kubecost/frontend
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  ipv6:
    enabled: false
kubecostModel:
  image: public.ecr.aws/kubecost/cost-model
forecasting:
  image:
    repository: public.ecr.aws/kubecost/kubecost-modeling
networkCosts:
  enabled: true
  image:
    repository: public.ecr.aws/kubecost/kubecost-network-costs
  priorityClassName: system-node-critical
reporting:
  productAnalytics: false